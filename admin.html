<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Admin login | Pick your place</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=mobile-layout-1" />
    <script src="/admin.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Pick your place home">
        <span class="wordmark-mark" aria-hidden="true">P</span>
        <span>COMMON<span class="wordmark-dot">/</span>PLACE</span>
      </a>
      <a class="nav-link" href="/">BACK TO SIGNUP <span aria-hidden="true">↗</span></a>
    </header>

    <main class="admin-main">
      <section class="admin-intro" aria-labelledby="page-title">
        <p class="eyebrow"><span class="eyebrow-line"></span> ADMIN ACCESS</p>
        <h1 id="page-title">The list,<br /><span>in good hands.</span></h1>
        <p class="intro-copy">Sign in to review selections and manage reserved places.</p>
      </section>
      <section class="admin-panel" aria-labelledby="login-title">
        <p class="eyebrow panel-eyebrow">PRIVATE AREA <span class="panel-rule"></span></p>
        <h2 id="login-title">Admin sign in</h2>
        <form id="login-form" class="login-form">
          <label class="text-field">
            <span class="field-label">USERNAME <span>*</span></span>
            <input name="username" autocomplete="username" placeholder="Admin username" required />
          </label>
          <label class="text-field">
            <span class="field-label">PASSWORD <span>*</span></span>
            <input name="password" type="password" autocomplete="current-password" placeholder="Admin password" required />
          </label>
          <button class="submit-button" type="submit" id="login-button"><span>Sign in</span><span class="button-arrow" aria-hidden="true">↗</span></button>
          <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <span>ADMINISTRATOR ACCESS ONLY</span>
      <span class="footer-mark" aria-hidden="true">C/P</span>
      <span>CAPACITY IS LIMITED</span>
    </footer>
  </body>
</html>
